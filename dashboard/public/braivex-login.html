<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Braivex Vaani CRM — Sign in</title>
<meta name="description" content="Sign in to Braivex Vaani CRM." />
<meta name="theme-color" content="#0b0f19" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #0b0f19;
    --card: #111827;
    --card-2: #0f1523;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.14);
    --text: #f3f4f6;
    --muted: #94a3b8;
    --dim: #64748b;
    --gold: #f5c842;
    --gold-2: #d2ae59;
    --danger: #f87171;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(circle at 50% -10%, rgba(245, 200, 66, 0.14), transparent 42%),
      var(--bg);
    color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--gold); text-decoration: none; }
  a:hover { color: #ffd95a; }
  .card {
    width: 100%; max-width: 440px;
    background: var(--card);
    border: 1px solid var(--line-strong);
    border-radius: 20px;
    padding: 30px 28px 24px;
    box-shadow: 0 40px 100px -40px rgba(0, 0, 0, 0.9);
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .mark {
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, #ffe58a, var(--gold) 55%, #b8860b);
    color: #0b0f19; font-size: 18px; font-weight: 900;
    box-shadow: 0 8px 22px -8px rgba(245, 200, 66, 0.65);
  }
  .brand-name { font-size: 15px; font-weight: 800; letter-spacing: 0.16em; }
  .brand-name em { color: var(--gold); font-style: normal; }
  .product { color: var(--dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
  .tabs {
    display: flex; gap: 5px; margin: 24px 0 20px; padding: 4px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  .tab {
    flex: 1; height: 34px; border: 0; border-radius: 7px; background: transparent;
    color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .tab:hover { color: #fff; }
  .tab.active { background: var(--gold); color: #0b0f19; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
  .sub { margin: 6px 0 20px; color: var(--muted); font-size: 13px; }
  label { display: block; color: var(--muted); font-size: 12px; font-weight: 600; margin: 12px 0 6px; }
  input {
    width: 100%; height: 42px; padding: 0 12px;
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: 8px;
    color: var(--text); font-size: 14px; outline: none;
  }
  input:focus { border-color: rgba(245, 200, 66, 0.6); box-shadow: 0 0 0 3px rgba(245, 200, 66, 0.12); }
  input::placeholder { color: var(--dim); }
  .hint { margin: 6px 0 0; color: var(--dim); font-size: 11px; }
  .error {
    display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.35);
    color: #fecaca; font-size: 12px;
  }
  .error.show { display: block; }
  button[type="submit"] {
    width: 100%; height: 44px; margin-top: 18px; border: 0; border-radius: 8px;
    background: var(--gold); color: #0b0f19; font-size: 14px; font-weight: 800; cursor: pointer;
  }
  button[type="submit"]:hover:not(:disabled) { background: #ffd95a; }
  button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
  .foot {
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
    color: var(--dim); font-size: 12px;
  }
  .foot a { color: var(--muted); }
  .foot a:hover { color: #fff; }
  .nojs { max-width: 440px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  @media (max-width: 480px) {
    body { padding: 14px; }
    .card { padding: 24px 20px 20px; }
  }
</style>
</head>
<body>
<main class="card" id="authCard" hidden>
  <div class="brand">
    <div class="mark" aria-hidden="true">B</div>
    <div>
      <div class="brand-name">BRAIVEX<em>.</em></div>
      <div class="product">Vaani CRM</div>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Account access">
    <button class="tab active" type="button" data-mode="login" role="tab" aria-selected="true">Sign in</button>
    <button class="tab" type="button" data-mode="signup" role="tab" aria-selected="false">Create account</button>
  </div>

  <h1 id="authTitle">Welcome back.</h1>
  <p class="sub" id="authSub">Sign in to open your Braivex Vaani CRM.</p>

  <form id="authForm" novalidate>
    <div id="signupFields" hidden>
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="Your full name" />
      <label for="company">Company / workspace</label>
      <input id="company" name="company" type="text" autocomplete="organization" placeholder="Shyam Earthmover" />
    </div>

    <label for="email">Work email</label>
    <input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
    <p class="hint" id="passwordHint" hidden>Use at least 12 characters.</p>

    <div class="error" id="authError" role="alert" aria-live="assertive"></div>
    <button id="submitBtn" type="submit">Sign in</button>
  </form>

  <div class="foot">
    <a href="/">Back to home</a>
    <span>·</span>
    <a href="/app.html">Open CRM</a>
  </div>
</main>

<noscript>
  <div class="nojs"><strong>JavaScript is required.</strong> Please enable JavaScript to sign in.</div>
</noscript>

<script>
(function () {
  'use strict';

  var DASHBOARD_URL = '/app.html';
  var LOGIN_ROUTE = '/api/auth/login';
  var SIGNUP_ROUTE = '/api/auth/signup';
  var mode = 'login';
  var authToken = null;

  // Supabase email links land here with the session token in the URL hash.
  // Trade it for the HttpOnly cookie, then redirect without the token in the URL.
  var hashToken = new URLSearchParams(window.location.hash.slice(1)).get('access_token');
  if (hashToken) {
    fetch('/api/auth/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ access_token: hashToken })
    }).then(function (res) {
      if (!res.ok) throw new Error('bad token');
      window.location.replace(DASHBOARD_URL);
    }).catch(function () {
      window.location.replace('/braivex-login.html?auth_error=1');
    });
    return;
  }

  var card = document.getElementById('authCard');
  var form = document.getElementById('authForm');
  var title = document.getElementById('authTitle');
  var sub = document.getElementById('authSub');
  var signupFields = document.getElementById('signupFields');
  var passwordHint = document.getElementById('passwordHint');
  var errorBox = document.getElementById('authError');
  var submitBtn = document.getElementById('submitBtn');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));

  function safeRedirect() {
    try {
      var q = new URLSearchParams(window.location.search).get('redirect');
      if (q && q.charAt(0) === '/' && q.charAt(1) !== '/' && q.charAt(1) !== '\\') return q;
    } catch (_) {}
    return DASHBOARD_URL;
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show');
  }

  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }

  function setMode(next) {
    mode = next === 'signup' ? 'signup' : 'login';
    tabs.forEach(function (tab) {
      var active = tab.getAttribute('data-mode') === mode;
      tab.classList.toggle('active', active);
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    signupFields.hidden = mode !== 'signup';
    passwordHint.hidden = mode !== 'signup';
    document.getElementById('password').setAttribute('autocomplete', mode === 'signup' ? 'new-password' : 'current-password');
    title.textContent = mode === 'signup' ? 'Create your workspace.' : 'Welcome back.';
    sub.textContent = mode === 'signup'
      ? 'Start with a clean, isolated Braivex Vaani CRM workspace.'
      : 'Sign in to open your Braivex Vaani CRM.';
    submitBtn.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
    clearError();
  }

  function setLoading(loading) {
    submitBtn.disabled = loading;
    submitBtn.textContent = loading
      ? (mode === 'signup' ? 'Creating workspace...' : 'Signing in...')
      : (mode === 'signup' ? 'Create account' : 'Sign in');
  }

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      setMode(tab.getAttribute('data-mode'));
    });
  });

  var params = new URLSearchParams(window.location.search);
  var fresh = params.get('fresh') === '1';
  var requestedMode = params.get('mode') === 'signup' ? 'signup' : 'login';
  setMode(requestedMode);
  if (params.get('auth_error') === '1') {
    showError('That sign-in link is invalid or expired. Sign in again.');
  }

  if (fresh || requestedMode === 'signup') {
    card.hidden = false;
  } else {
    card.hidden = false;
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    clearError();

    var email = (document.getElementById('email').value || '').trim();
    var password = document.getElementById('password').value || '';
    var name = (document.getElementById('name').value || '').trim();
    var company = (document.getElementById('company').value || '').trim();

    if (!email || !password) {
      showError('Email and password are required.');
      return;
    }
    if (mode === 'signup' && password.length < 12) {
      showError('Use at least 12 characters for your password.');
      return;
    }

    var route = mode === 'signup' ? SIGNUP_ROUTE : LOGIN_ROUTE;
    var payload = mode === 'signup'
      ? { name: name, company: company, email: email, password: password }
      : { email: email, password: password };

    setLoading(true);

    fetch(route, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          return { res: res, data: data };
        });
      })
      .then(function (result) {
        if (result.res.ok) {
          authToken = result.data && result.data.accessToken;
          if (authToken) {
            window.location.href = safeRedirect();
          } else {
            showError('Account created. Check your email to confirm it, then sign in.');
            setLoading(false);
          }
          return;
        }

        var message = (result.data && result.data.error) || 'Something went wrong.';
        if (result.res.status === 401) {
          message = 'Invalid email or password.';
        } else if (result.res.status === 409) {
          message = 'This email already has an account. Sign in instead.';
        } else if (result.res.status === 422 && /password/i.test(message)) {
          message = 'Use at least 12 characters for your password.';
        } else if (result.res.status === 422 && /email/i.test(message)) {
          message = 'Enter a valid email address.';
        } else if (result.res.status >= 500) {
          message = 'The sign-in service is unavailable. Check that the server is running and try again.';
        }

        showError(message);
        setLoading(false);
      })
      .catch(function () {
        showError('Could not reach the server. Check that it is running and try again.');
        setLoading(false);
      });
  });
})();
</script>
</body>
</html>
