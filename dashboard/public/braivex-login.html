<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VAANI — Sign in</title>
<meta name="description" content="Sign in to Vaani." />
<meta name="theme-color" content="#0b0f19" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #0b0f19;
    --card: #151b2b;
    --border: #2a3441;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #d2ae59;
    --accent-hover: #b8984d;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; font-size: 14px;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 32px 28px;
  }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: 3px; }
  .brand span { color: var(--accent); }
  .product { color: var(--muted); margin-top: 6px; font-size: 13px; letter-spacing: 1px; }
  h1 { font-size: 18px; margin: 22px 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 6px; font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 20px; padding: 11px; border: none; border-radius: 6px;
    background: var(--accent); color: #000; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .error {
    display: none; margin-top: 14px; padding: 10px 12px; border-radius: 6px;
    background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5; font-size: 13px;
  }
  .error.show { display: block; }
  .foot { margin-top: 18px; text-align: center; color: var(--muted); font-size: 12px; }
  @media (max-width: 480px) {
    body { padding: 16px; }
    .card { padding: 24px 20px; }
  }
</style>
</head>
<body>
<main class="card" id="loginCard" hidden>
  <div class="brand">VAANI</div>
  <div class="product">VAANI &mdash; Sign in</div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in with your account to open Vaani.</p>
  <form id="loginForm" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <div class="error" id="loginError" role="alert" aria-live="assertive"></div>
    <button id="loginBtn" type="submit">Sign in to VAANI</button>
  </form>
  <div class="foot">VAANI</div>
</main>
<noscript>
  <div class="card"><strong>JavaScript is required.</strong> Please enable JavaScript to sign in.</div>
</noscript>
<script>
(function () {
  'use strict';
  var LOGIN_ROUTE = '/api/auth/braivex/login';
  var DASHBOARD_URL = '/vaani-sales.html';
  var GENERIC_ERROR = 'Invalid email or password.';

  function safeRedirect() {
    try {
      var q = new URLSearchParams(window.location.search).get('redirect');
      if (q && q.charAt(0) === '/' && q.charAt(1) !== '/') return q;
    } catch (_) {}
    return DASHBOARD_URL;
  }

  function showError(msg) {
    var el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.add('show');
  }

  function clearError() {
    var el = document.getElementById('loginError');
    el.textContent = '';
    el.classList.remove('show');
  }

  // Authenticated users skip the form, unless fresh=1 forces a real
  // re-authentication (dashboard bounced here with a valid cookie but no
  // bearer handoff, e.g. brand-new tab: auto-bounce would loop forever, so
  // the form is shown instead). Session state lives in the backend-managed
  // cookie; nothing is read from or written to web storage.
  var fresh = false;
  try { fresh = new URLSearchParams(window.location.search).get('fresh') === '1'; } catch (_) {}
  function showForm() { document.getElementById('loginCard').hidden = false; }
  if (fresh) {
    showForm();
  } else fetch('/api/me', { credentials: 'same-origin' }).then(function (res) {
    if (res.ok) {
      window.location.href = safeRedirect();
      return;
    }
    showForm();
  }).catch(function () {
    showForm();
  });

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();
    var email = (document.getElementById('email').value || '').trim();
    var password = document.getElementById('password').value || '';
    if (!email || !password) {
      showError(GENERIC_ERROR);
      return;
    }
    var btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    fetch(LOGIN_ROUTE, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    }).then(function (res) {
      if (res.ok) {
        // One-time, tab-scoped, in-memory handoff of the Supabase access
        // token for bearer-migrated Vaani endpoints. window.name never
        // touches localStorage/sessionStorage; the dashboard retains it
        // across refreshes and clears it on logout or dead token.
        res.json().then(function (data) {
          try {
            console.log('[LOGIN] Received data:', data, 'token:', data ? data.token : null);
            if (data && data.token) {
              console.log('[LOGIN] Saving token to localStorage:', data.token);
              localStorage.setItem('token', data.token);
              window.name = JSON.stringify({ token: data.token });
            }
            if (data && data.braivexAccessToken) {
              window.name = JSON.stringify({ braivexAccessToken: data.braivexAccessToken });
            }
          } catch (_) {}
          window.location.href = DASHBOARD_URL;
        }).catch(function () {
          window.location.href = DASHBOARD_URL;
        });
        return;
      }
      showError(GENERIC_ERROR);
    }).catch(function () {
      showError(GENERIC_ERROR);
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = 'Sign in to VAANI';
      document.getElementById('password').value = '';
    });
  });
})();
</script>
</body>
</html>
